<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      margin: auto;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    const canvas = document.getElementById('canvas');

    canvas.addEventListener('webglcontextlost', (event) => {
      event.preventDefault();
      console.error('WebGL context lost. Reload the page to restart the game.');
    });

    var Module = {
      canvas,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: () => {},
      monitorRunDependencies: () => {}
    };
  </script>
  <script async src="WebDemo.js"></script>
</body>
</html>
